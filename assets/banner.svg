<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#101A36"/>
    </linearGradient>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- the mandate boundary -->
  <rect x="820" y="60" width="300" height="180" rx="18" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- the agent, bouncing off the limits -->
  <circle r="12" fill="#22D3EE">
    <animate attributeName="cx" values="850;1090;1090;850;850" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;130;210;170;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="26" fill="none" stroke="#22D3EE" stroke-opacity=".35">
    <animate attributeName="cx" values="850;1090;1090;850;850" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;130;210;170;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;30;14" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="140" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#F8FAFC">Mandate</text>
  <text x="82" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#94A3B8">Bounded agent wallets on Arc · limits enforced on-chain</text>
  <rect x="82" y="215" width="260" height="4" rx="2" fill="url(#g)">
    <animate attributeName="width" values="0;260;260" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
